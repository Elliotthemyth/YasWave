name: Build Multi-Platform (Android, Windows, Linux)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with artifacts'
        required: false
        type: boolean
        default: true

jobs:
  # ================================================================
  # 1. BUILD WINDOWS (.EXE & .MSI)
  # ================================================================
  build-windows:
    name: Build Windows (EXE / MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web Frontend
        run: bun run build

      - name: Build Windows Binaries via Tauri
        run: bunx tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YasWave-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # ================================================================
  # 2. BUILD LINUX (.APPIMAGE & .DEB)
  # ================================================================
  build-linux:
    name: Build Linux (AppImage & DEB)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web Frontend
        run: bun run build

      - name: Build Linux Bundles via Tauri
        run: bunx tauri build --bundles appimage,deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YasWave-Linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  # ================================================================
  # 3. BUILD ANDROID (.APK)
  # ================================================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;26.1.10909125"

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build Android APK via Tauri
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          bunx tauri android build --apk --target aarch64 --debug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YasWave-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk

  # ================================================================
  # 4. GITHUB RELEASE
  # ================================================================
  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'push' || inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: YasWave-Windows-x64
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: YasWave-Linux-x64
          path: release-assets/linux
      - uses: actions/download-artifact@v4
        with:
          name: YasWave-Android-APK
          path: release-assets/android
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          name: YasWave ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }} (Android, Windows, Linux)
          body: |
            Cross-platform builds of YASWAVE (Tauri 2).

            - Windows x64: NSIS installer (`*-setup.exe`), MSI and portable `.exe`
            - Linux x64: AppImage and `.deb`
            - Android (arm64): installable debug-signed APK

            Android release APKs require a local signing key (see `src-tauri/gen/android/keystore.properties`).
          files: |
            release-assets/android/*.apk
            release-assets/windows/*.exe
            release-assets/windows/*.msi
            release-assets/linux/*.AppImage
            release-assets/linux/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
