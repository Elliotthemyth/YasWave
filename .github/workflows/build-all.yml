name: Multi-Platform Release (Android, Windows, Linux)

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.2.0)'
        required: false
        default: ''
      create_release:
        description: 'Create/Update GitHub Release with attached binaries'
        required: false
        type: boolean
        default: true
      is_prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ================================================================
  # 1. BUILD WINDOWS (x64 NSIS Installer & Portable EXE)
  # ================================================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web Frontend
        run: bun run build

      - name: Build Windows Binaries via Tauri
        run: bunx tauri build

      - name: Prepare Windows Release Artifacts
        shell: bash
        run: |
          mkdir -p dist-windows
          cp src-tauri/target/release/bundle/nsis/*.exe dist-windows/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi dist-windows/ 2>/dev/null || true
          cp src-tauri/target/release/*.exe dist-windows/ 2>/dev/null || true
          ls -la dist-windows/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YasWave-Windows-x64
          path: dist-windows/*
          if-no-files-found: warn

  # ================================================================
  # 2. BUILD LINUX (x64 AppImage & DEB)
  # ================================================================
  build-linux:
    name: Build Linux (AppImage & DEB)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web Frontend
        run: bun run build

      - name: Build Linux Bundles via Tauri
        run: bunx tauri build --bundles appimage,deb

      - name: Prepare Linux Release Artifacts
        run: |
          mkdir -p dist-linux
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-linux/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/deb/*.deb dist-linux/ 2>/dev/null || true
          ls -la dist-linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YasWave-Linux-x64
          path: dist-linux/*
          if-no-files-found: warn

  # ================================================================
  # 3. BUILD ANDROID (arm64-v8a Installable APK)
  # ================================================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK Packages & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;26.1.10909125"

      - name: Setup Rust Stable (Target aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web Frontend
        run: bun run build

      - name: Build Android APK via Tauri
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          bunx tauri android build --apk --target aarch64 --debug

      - name: Prepare Android Release Artifacts
        run: |
          mkdir -p dist-android
          find src-tauri/gen/android/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} dist-android/ \;
          ls -la dist-android/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YasWave-Android-APK
          path: dist-android/*
          if-no-files-found: warn

  # ================================================================
  # 4. GITHUB RELEASE & CHECKSUMS
  # ================================================================
  create-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/') || inputs.create_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: YasWave-Windows-x64
          path: release-files

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: YasWave-Linux-x64
          path: release-files

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: YasWave-Android-APK
          path: release-files

      - name: Generate Checksums & Organize Files
        run: |
          cd release-files
          echo "=== Collected Release Binaries ==="
          ls -lh
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Determine Tag Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            TAG="${GITHUB_REF#refs/heads/release/}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            VERSION=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version"[^"]*"([^"]+)".*/\1/')
            TAG="v$VERSION"
          fi
          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: YASWAVE ${{ steps.tag_info.outputs.tag }} — Cross-Platform Release
          prerelease: ${{ inputs.is_prerelease || false }}
          generate_release_notes: true
          body: |
            ## 🎵 YASWAVE Release ${{ steps.tag_info.outputs.tag }}
            
            Welcome to the official multi-platform build of **YASWAVE** — the modern, high-fidelity music player with synchronized LRC lyrics, Persian translations, BPM & Key detection, and audio visualization.
            
            ### 📦 Download Assets
            
            | Platform | File Format | Details |
            |---|---|---|
            | 📱 **Android** | `.apk` (arm64-v8a) | Installable on modern Android phones & tablets (Android 7.0+) |
            | 🪟 **Windows** | `.exe` (NSIS Installer & Portable) | 64-bit Windows 10 & 11 |
            | 🐧 **Linux** | `.AppImage` & `.deb` | Modern Linux distributions (Ubuntu, Debian, Fedora, Arch) |
            
            ### 🔐 Checksums
            Verify the integrity of downloaded binaries using `SHA256SUMS.txt` attached to this release:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
            
            ---
            *Built automatically via GitHub Actions with Tauri 2 & Bun.*
          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
