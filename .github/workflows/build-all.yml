name: Build Multi-Platform (Android, Windows, Linux)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with artifacts'
        required: false
        type: boolean
        default: true

jobs:
  # ================================================================
  # 1. BUILD WINDOWS (.EXE & .MSI)
  # ================================================================
  build-windows:
    name: Build Windows (EXE / MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Build Windows Binaries via Tauri
        run: npx tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YasWave-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # ================================================================
  # 2. BUILD LINUX (.APPIMAGE & .DEB)
  # ================================================================
  build-linux:
    name: Build Linux (AppImage & DEB)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Build Linux Bundles via Tauri
        run: npx tauri build --bundles appimage,deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YasWave-Linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  # ================================================================
  # 3. BUILD ANDROID (.APK)
  # ================================================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Install Capacitor for Android
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Frontend
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YasWave-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ================================================================
  # 4. GITHUB RELEASE
  # ================================================================
  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: YasWave-Windows-x64
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: YasWave-Linux-x64
          path: release-assets/linux
      - uses: actions/download-artifact@v4
        with:
          name: YasWave-Android-APK
          path: release-assets/android
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: YasWave ${{ github.ref_name || 'v1.0.0' }} (Android, Windows, Linux)
          files: |
            release-assets/android/*.apk
            release-assets/windows/*.exe
            release-assets/windows/*.msi
            release-assets/linux/*.AppImage
            release-assets/linux/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
